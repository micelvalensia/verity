id: GEN-SEC-001
name: No Hardcoded Secrets or Credentials
pack: verity:core
severity: critical
file_patterns:
  - "**/*"
criteria: |
  Dilarang keras menuliskan credential sensitif secara langsung (hardcoded), seperti API token,
  private key, JWT secret, database password, AWS credentials, atau auth token dalam bentuk string literal.
verification:
  method: deterministic
  regex_patterns:
    - "(api[_-]?key|secret|token|password|passwd|auth[_-]?token|bearer|private[_-]?key)\\s*[:=]\\s*['\"][A-Za-z0-9_\\-\\.~+=]{16,}['\"]"
    - "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
    - "ghp_[0-9a-zA-Z]{36}"
    - "xox[baprs]-[0-9a-zA-Z]{10,48}"
evidence_requirements:
  pass_condition: "Semua konfigurasi credential diambil melalui environment variable atau secret manager."
  fail_condition: "Ditemukan string literal dengan pola token/secret pada kode aktif (bukan komentar atau file test/mock)."
  unknown_condition: "Ditemukan string acak menyerupai hash/token tetapi tidak dapat dipastikan apakah itu dummy data atau secret riil."
